<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Summernote Heading v3 BS4 compatibility fixture</title>
  <link rel="stylesheet" href="/browser-tests/node_modules/bootstrap4/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/browser-tests/node_modules/summernote/dist/summernote-bs4.css">
</head>
<body>
  <main class="container py-4">
    <textarea id="editor-a"></textarea>
    <textarea id="editor-b"></textarea>
  </main>
  <script src="/browser-tests/node_modules/jquery/dist/jquery.min.js"></script>
  <script src="/browser-tests/node_modules/bootstrap4/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/browser-tests/node_modules/summernote/dist/summernote-bs4.js"></script>
  <script src="/vendor/summernote-heading/dist/v3/summernote-heading.js"></script>
  <script>
    window.createEditor = function (selector) {
      $(selector).summernote({ height: 180, toolbar: [['insert', ['summernoteHeading']]] });
    };
    window.destroyEditor = (selector) => $(selector).summernote('destroy');
    window.undoEditor = (selector) => $(selector).summernote('undo');
    $(function () { window.createEditor('#editor-a'); window.createEditor('#editor-b'); });
  </script>
</body>
</html>

name: Sync rc.10 lock identity

on:
  push:
    branches:
      - release/rc.10

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/rc.10
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Synchronize only root package identities
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          let text = fs.readFileSync(path, 'utf8');
          const from = '"version": "3.0.0-rc.9"';
          const to = '"version": "3.0.0-rc.10"';
          const matches = text.split(from).length - 1;
          if (matches !== 2) {
            throw new Error(`Expected exactly 2 rc.9 root identity fields, found ${matches}`);
          }
          text = text.replace(from, to).replace(from, to);
          fs.writeFileSync(path, text);
          NODE
          rm .github/workflows/rc10-sync-lock.yml
          git diff --exit-code -- package-lock.json && exit 1 || true
          git diff -- package-lock.json
      - name: Commit synchronized lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/rc10-sync-lock.yml
          git commit -m "chore: sync rc.10 package-lock identity"
          git push origin HEAD:release/rc.10

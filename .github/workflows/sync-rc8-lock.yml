name: Sync rc8 lockfile

on:
  push:
    branches:
      - release/bricks-3.0.0-rc.8
    paths:
      - .github/workflows/sync-rc8-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/bricks-3.0.0-rc.8
      - name: Synchronize package-lock root identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('package-lock.json')
          s = p.read_text()
          old = '"version": "3.0.0-rc.7"'
          new = '"version": "3.0.0-rc.8"'
          if s.count(old) < 2:
              raise SystemExit('expected two rc.7 identity fields')
          s = s.replace(old, new, 2)
          p.write_text(s)
          PY
          git diff -- package-lock.json
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          git config user.name "eissasoubhi"
          git config user.email "4972714+eissasoubhi@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize rc.8 lockfile identity"
          git push origin HEAD:release/bricks-3.0.0-rc.8

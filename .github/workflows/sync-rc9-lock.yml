name: Sync rc.9 lock identity

on:
  push:
    branches:
      - release/bricks-3.0.0-rc.9

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/bricks-3.0.0-rc.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Synchronize lockfile identity only
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "3.0.0-rc.9"
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package.json
          git diff --name-only | grep -qx 'package-lock.json'
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.version !== manifest.version || lock.packages?.['']?.version !== manifest.version) {
            throw new Error('lockfile identity did not synchronize to package version');
          }
          NODE
      - name: Commit lockfile identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(release): sync rc.9 lockfile identity'
          git push

name: Browser compatibility

on:
  push:
    branches:
      - 'agent/v3-browser-harness'
      - 'agent/v3-gallery-browser'
      - 'agent/v3-composition-browser'
      - 'agent/v3-vite-artifact-browser'
      - 'agent/v3-bs4-bs3-matrix'
      - 'agent/v3-bs4-bs3-standalone'
      - 'agent/v3-packed-artifact-browser'
      - 'agent/v3-public-package-browser'
      - 'agent/v3-all-public-packages-browser'
      - 'agent/playwright-browser-cache'
  pull_request:
    branches:
      - agent/modernization-baseline
      - agent/v3-browser-harness
      - agent/v3-gallery-browser
      - agent/v3-composition-browser
      - agent/v3-vite-artifact-browser
      - agent/v3-bs4-bs3-matrix
      - agent/v3-bs4-bs3-standalone
      - agent/v3-packed-artifact-browser
      - agent/v3-public-package-browser
      - agent/v3-all-public-packages-browser

permissions:
  contents: read

jobs:
  v3-plugins:
    name: Summernote 0.9.1 / public Bricks + Heading + Gallery packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout compatibility harness
        uses: actions/checkout@v6

      - name: Checkout Bricks v3 public package candidate
        uses: actions/checkout@v6
        with:
          repository: eissasoubhi/summernote-bricks
          ref: 4d66fcbb8a4fa24523834e51844473c1de7b2041
          path: vendor/summernote-bricks-public

      - name: Checkout Heading v3 public package candidate
        uses: actions/checkout@v6
        with:
          repository: eissasoubhi/summernote-heading
          ref: f8e4496f6b75b17d5b4122f8fb2c7df4d23581a4
          path: vendor/summernote-heading

      - name: Checkout Gallery v3 public package candidate
        uses: actions/checkout@v6
        with:
          repository: eissasoubhi/summernote-gallery
          ref: 14185c50733aded837f8f42081f2fd08145989f4
          path: vendor/summernote-gallery

      - name: Setup Node for v3 packages and browser harness
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build and pack public Bricks v3 candidate
        run: |
          cd vendor/summernote-bricks-public/v3-tooling
          npm install
          npm run check
          cd ..
          rm -rf .release-stage dist/v3
          mkdir -p .release-stage/dist dist/v3/packed
          cp -R v3-tooling/dist/. .release-stage/dist/
          cp README.md LICENSE .release-stage/
          cp package.v3.json .release-stage/package.json
          cd .release-stage
          npm pack --pack-destination ../dist/v3 >/dev/null
          cd ..
          tar -xzf dist/v3/*.tgz -C dist/v3/packed
          test -f dist/v3/packed/package/dist/summernote-bricks.umd.cjs
          mkdir -p ../../dist
          cp dist/v3/packed/package/dist/summernote-bricks.umd.cjs ../../dist/summernote-extensions.min.js

      - name: Build and pack public Heading v3 candidate
        run: |
          cd vendor/summernote-heading/v3-tooling
          npm install
          npm run check
          cd ..
          rm -rf .release-stage dist/v3
          mkdir -p .release-stage/dist dist/v3/packed
          cp -R v3-tooling/dist/. .release-stage/dist/
          cp README.md LICENSE .release-stage/
          cp package.v3.json .release-stage/package.json
          cd .release-stage
          npm pack --pack-destination ../dist/v3 >/dev/null
          cd ..
          tar -xzf dist/v3/*.tgz -C dist/v3/packed
          test -f dist/v3/packed/package/dist/index.umd.cjs
          cp dist/v3/packed/package/dist/index.umd.cjs dist/v3/summernote-heading.js

      - name: Build and pack public Gallery v3 candidate
        run: |
          cd vendor/summernote-gallery/v3-tooling
          npm install
          npm run check
          cd ..
          rm -rf .release-stage dist/v3
          mkdir -p .release-stage/dist dist/v3/packed
          cp -R v3-tooling/dist/. .release-stage/dist/
          cp README.md LICENSE .release-stage/
          cp package.v3.json .release-stage/package.json
          cd .release-stage
          npm pack --pack-destination ../dist/v3 >/dev/null
          cd ..
          tar -xzf dist/v3/*.tgz -C dist/v3/packed
          test -f dist/v3/packed/package/dist/index.umd.cjs
          cp dist/v3/packed/package/dist/index.umd.cjs dist/v3/summernote-gallery.js

      - name: Install browser harness
        working-directory: browser-tests
        run: npm install

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('browser-tests/package.json') }}

      - name: Install Playwright system dependencies
        working-directory: browser-tests
        run: npx playwright install-deps chromium firefox webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: browser-tests
        run: npx playwright install chromium firefox webkit

      - name: Run Summernote browser matrix
        working-directory: browser-tests
        run: npm test

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            browser-tests/playwright-report
            browser-tests/test-results
          if-no-files-found: warn
          retention-days: 7

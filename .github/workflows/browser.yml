name: Browser compatibility

on:
  push:
    branches:
      - 'agent/v3-browser-harness'
      - 'agent/v3-gallery-browser'
      - 'agent/v3-composition-browser'
      - 'agent/v3-vite-artifact-browser'
      - 'agent/v3-bs4-bs3-matrix'
      - 'agent/v3-bs4-bs3-standalone'
      - 'agent/v3-packed-artifact-browser'
      - 'agent/v3-public-package-browser'
      - 'agent/v3-all-public-packages-browser'
      - 'agent/playwright-browser-cache'
      - 'agent/v3-root-packages-browser'
  pull_request:
    branches:
      - agent/modernization-baseline
      - agent/v3-browser-harness
      - agent/v3-gallery-browser
      - agent/v3-composition-browser
      - agent/v3-vite-artifact-browser
      - agent/v3-bs4-bs3-matrix
      - agent/v3-bs4-bs3-standalone
      - agent/v3-packed-artifact-browser
      - agent/v3-public-package-browser
      - agent/v3-all-public-packages-browser
      - agent/playwright-browser-cache

permissions:
  contents: read

jobs:
  v3-plugins:
    name: Summernote 0.9.1 / promoted root Bricks + Heading + Gallery packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout compatibility harness
        uses: actions/checkout@v6

      - name: Checkout promoted Bricks root package
        uses: actions/checkout@v6
        with:
          repository: eissasoubhi/summernote-bricks
          ref: cbdd33db58681e4d268852b1ae815be8e63b631e
          path: vendor/summernote-bricks-root

      - name: Checkout promoted Heading root package
        uses: actions/checkout@v6
        with:
          repository: eissasoubhi/summernote-heading
          ref: 5126d188d4f620adf29c949e2a69d1a19cbcf3ec
          path: vendor/summernote-heading

      - name: Checkout promoted Gallery root package
        uses: actions/checkout@v6
        with:
          repository: eissasoubhi/summernote-gallery
          ref: 58d2d9bca574ea07439fe53424fe2a194a9cfda9
          path: vendor/summernote-gallery

      - name: Setup Node for root packages and browser harness
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build and pack promoted Bricks root package
        run: |
          cd vendor/summernote-bricks-root
          npm install
          npm run check
          rm -rf .browser-package
          mkdir -p .browser-package/extracted
          npm pack --ignore-scripts --pack-destination .browser-package >/dev/null
          tar -xzf .browser-package/*.tgz -C .browser-package/extracted
          test -f .browser-package/extracted/package/dist/summernote-bricks.umd.cjs
          mkdir -p ../../dist
          cp .browser-package/extracted/package/dist/summernote-bricks.umd.cjs ../../dist/summernote-extensions.min.js

      - name: Build and pack promoted Heading root package
        run: |
          cd vendor/summernote-heading
          npm install
          npm run check
          rm -rf .browser-package
          mkdir -p .browser-package/extracted
          npm pack --ignore-scripts --pack-destination .browser-package >/dev/null
          tar -xzf .browser-package/*.tgz -C .browser-package/extracted
          test -f .browser-package/extracted/package/dist/index.umd.cjs
          mkdir -p dist/v3
          cp .browser-package/extracted/package/dist/index.umd.cjs dist/v3/summernote-heading.js

      - name: Build and pack promoted Gallery root package
        run: |
          cd vendor/summernote-gallery
          npm install
          npm run check
          rm -rf .browser-package
          mkdir -p .browser-package/extracted
          npm pack --ignore-scripts --pack-destination .browser-package >/dev/null
          tar -xzf .browser-package/*.tgz -C .browser-package/extracted
          test -f .browser-package/extracted/package/dist/index.umd.cjs
          mkdir -p dist/v3
          cp .browser-package/extracted/package/dist/index.umd.cjs dist/v3/summernote-gallery.js

      - name: Install browser harness
        working-directory: browser-tests
        run: npm install

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('browser-tests/package.json') }}

      - name: Install Playwright system dependencies
        working-directory: browser-tests
        run: npx playwright install-deps chromium firefox webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: browser-tests
        run: npx playwright install chromium firefox webkit

      - name: Run Summernote browser matrix
        working-directory: browser-tests
        run: npm test

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            browser-tests/playwright-report
            browser-tests/test-results
          if-no-files-found: warn
          retention-days: 7

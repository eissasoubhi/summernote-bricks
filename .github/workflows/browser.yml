name: Browser compatibility

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  v3-plugins:
    name: Summernote 0.9.1 / root Bricks + Heading + Gallery packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    env:
      HOME: /root
      BRICKS_SOURCE_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      BRICKS_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      RELEASE_ELIGIBLE: ${{ github.ref == 'refs/heads/master' }}

    steps:
      - name: Checkout Bricks and compatibility harness
        uses: actions/checkout@v6

      - name: Checkout Heading standalone compatibility baseline
        uses: actions/checkout@v6
        with:
          repository: eissasoubhi/summernote-heading
          ref: main
          path: vendor/summernote-heading

      - name: Checkout Gallery standalone compatibility baseline
        uses: actions/checkout@v6
        with:
          repository: eissasoubhi/summernote-gallery
          ref: master
          path: vendor/summernote-gallery

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record exact compatibility inputs
        run: |
          mkdir -p browser-tests/evidence
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');

          const readPackage = (cwd) => JSON.parse(fs.readFileSync(path.join(cwd, 'package.json'), 'utf8'));
          const gitSha = (cwd) => execFileSync('git', ['-c', `safe.directory=${cwd}`, 'rev-parse', 'HEAD'], { cwd, encoding: 'utf8' }).trim();
          const root = process.cwd();
          const headingBaselineDir = path.join(root, 'vendor/summernote-heading');
          const galleryBaselineDir = path.join(root, 'vendor/summernote-gallery');
          const headingPackageDir = path.join(root, 'packages/heading');
          const galleryPackageDir = path.join(root, 'packages/gallery');
          const bricksPackage = readPackage(root);
          const headingPackage = readPackage(headingPackageDir);
          const galleryPackage = readPackage(galleryPackageDir);

          const evidence = {
            schemaVersion: 4,
            generatedAt: new Date().toISOString(),
            workflow: {
              repository: process.env.GITHUB_REPOSITORY,
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              event: process.env.GITHUB_EVENT_NAME,
              releaseEligible: process.env.RELEASE_ELIGIBLE === 'true',
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            },
            editor: {
              summernote: '0.9.1',
              primaryJquery: '3.7.1',
              minimumJquerySmoke: '3.6.0',
            },
            packages: {
              bricks: {
                repository: 'eissasoubhi/summernote-bricks',
                ref: process.env.GITHUB_REF,
                sha: gitSha(root),
                sourceRepository: 'eissasoubhi/summernote-bricks',
                sourceRef: process.env.BRICKS_SOURCE_REF,
                sourceSha: process.env.BRICKS_SOURCE_SHA,
                version: bricksPackage.version,
              },
              heading: {
                repository: 'eissasoubhi/summernote-heading',
                ref: 'main',
                sha: gitSha(headingBaselineDir),
                sourceRepository: 'eissasoubhi/summernote-bricks',
                sourceRef: process.env.BRICKS_SOURCE_REF,
                sourceSha: process.env.BRICKS_SOURCE_SHA,
                sourcePath: 'packages/heading',
                version: headingPackage.version,
              },
              gallery: {
                repository: 'eissasoubhi/summernote-gallery',
                ref: 'master',
                sha: gitSha(galleryBaselineDir),
                sourceRepository: 'eissasoubhi/summernote-bricks',
                sourceRef: process.env.BRICKS_SOURCE_REF,
                sourceSha: process.env.BRICKS_SOURCE_SHA,
                sourcePath: 'packages/gallery',
                version: galleryPackage.version,
              },
            },
          };

          const output = path.join(root, 'browser-tests/evidence/public-heads.json');
          fs.writeFileSync(output, `${JSON.stringify(evidence, null, 2)}\n`);

          const rows = Object.entries(evidence.packages)
            .map(([name, value]) => `| ${name} | \`${value.ref}\` | \`${value.sha}\` | \`${value.sourceRef}\` | \`${value.sourceSha}\` | \`${value.version}\` |`)
            .join('\n');
          const artifactClass = evidence.workflow.releaseEligible ? 'release-eligible public-master bundle' : 'CI-only compatibility bundle';
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Browser compatibility inputs\n\nArtifact class: **${artifactClass}**\n\nHeading/Gallery standalone SHAs are compatibility baselines; publishable artifacts are built from their monorepo package paths at the recorded Bricks source SHA.\n\n| Package | Compatibility ref | Compatibility SHA | Artifact source ref | Artifact source SHA | Version |\n| --- | --- | --- | --- | --- | --- |\n${rows}\n\nSummernote: \`0.9.1\` · jQuery matrix: \`3.7.1\` · minimum-peer smoke: \`3.6.0\`\n`,
          );
          NODE

      - name: Build and pack Bricks root package
        run: |
          npm ci
          npm run check
          rm -rf .browser-package
          mkdir -p .browser-package/extracted
          npm pack --ignore-scripts --pack-destination .browser-package >/dev/null
          tar -xzf .browser-package/*.tgz -C .browser-package/extracted
          test -f .browser-package/extracted/package/dist/summernote-bricks.umd.cjs
          cp .browser-package/extracted/package/dist/summernote-bricks.umd.cjs dist/summernote-extensions.min.js

      - name: Build and pack Heading monorepo package
        run: |
          npm run heading:cutover-check
          rm -rf packages/heading/.browser-package
          mkdir -p packages/heading/.browser-package/extracted
          cd packages/heading
          npm pack --ignore-scripts --pack-destination .browser-package >/dev/null
          tar -xzf .browser-package/*.tgz -C .browser-package/extracted
          test -f .browser-package/extracted/package/dist/index.umd.cjs
          mkdir -p ../../vendor/summernote-heading/dist/v3
          cp .browser-package/extracted/package/dist/index.umd.cjs ../../vendor/summernote-heading/dist/v3/summernote-heading.js

      - name: Build and pack Gallery monorepo package
        run: |
          npm run gallery:cutover-check
          rm -rf packages/gallery/.browser-package
          mkdir -p packages/gallery/.browser-package/extracted
          cd packages/gallery
          npm pack --ignore-scripts --pack-destination .browser-package >/dev/null
          tar -xzf .browser-package/*.tgz -C .browser-package/extracted
          test -f .browser-package/extracted/package/dist/index.umd.cjs
          mkdir -p ../../vendor/summernote-gallery/dist/v3
          cp .browser-package/extracted/package/dist/index.umd.cjs ../../vendor/summernote-gallery/dist/v3/summernote-gallery.js

      - name: Record browser-tested tarball digests
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = process.cwd();
          const evidencePath = path.join(root, 'browser-tests/evidence/public-heads.json');
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          const tarballFor = (cwd) => {
            const directory = path.join(cwd, '.browser-package');
            const names = fs.readdirSync(directory).filter((name) => name.endsWith('.tgz'));
            if (names.length !== 1) {
              throw new Error(`Expected exactly one tarball in ${directory}; found ${names.length}`);
            }
            const filename = names[0];
            const file = path.join(directory, filename);
            return {
              filename,
              sha256: crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'),
              bytes: fs.statSync(file).size,
            };
          };

          evidence.packages.bricks.tarball = tarballFor(root);
          evidence.packages.heading.tarball = tarballFor(path.join(root, 'packages/heading'));
          evidence.packages.gallery.tarball = tarballFor(path.join(root, 'packages/gallery'));
          fs.writeFileSync(evidencePath, `${JSON.stringify(evidence, null, 2)}\n`);

          const rows = Object.entries(evidence.packages)
            .map(([name, value]) => `| ${name} | \`${value.tarball.filename}\` | \`${value.tarball.sha256}\` | ${value.tarball.bytes} |`)
            .join('\n');
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `\n## Browser-tested package artifacts\n\n| Package | Tarball | SHA-256 | Bytes |\n| --- | --- | --- | ---: |\n${rows}\n`,
          );
          NODE

      - name: Install browser harness
        working-directory: browser-tests
        run: npm ci

      - name: Run Summernote browser matrix
        working-directory: browser-tests
        run: npm test

      - name: Install minimum supported jQuery peer
        working-directory: browser-tests
        run: npm install --no-save --ignore-scripts jquery@3.6.0

      - name: Smoke plugins with jQuery 3.6.0
        working-directory: browser-tests
        run: npx playwright test tests/composition-v3.spec.mjs --project=chromium

      - name: Upload exact browser-tested bundle
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RELEASE_ELIGIBLE == 'true' && format('browser-tested-release-bundle-{0}-{1}', github.run_id, github.run_attempt) || format('browser-tested-ci-bundle-{0}-{1}', github.run_id, github.run_attempt) }}
          path: |
            browser-tests/evidence/public-heads.json
            .browser-package/*.tgz
            packages/heading/.browser-package/*.tgz
            packages/gallery/.browser-package/*.tgz
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Download uploaded bundle for verification
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.RELEASE_ELIGIBLE == 'true' && format('browser-tested-release-bundle-{0}-{1}', github.run_id, github.run_attempt) || format('browser-tested-ci-bundle-{0}-{1}', github.run_id, github.run_attempt) }}
          path: browser-tests/evidence/release-bundle-roundtrip

      - name: Verify uploaded bundle identities and eligibility
        run: |
          npm run release:bundle-check -- browser-tests/evidence/release-bundle-roundtrip "$GITHUB_RUN_ID" "$RELEASE_ELIGIBLE"
          if [ "$RELEASE_ELIGIBLE" = "true" ]; then
            printf '\n✅ Release-eligible public-master bundle verified: exactly one evidence JSON and three digest-matching monorepo-owned tarballs.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\n✅ CI-only compatibility bundle verified. This artifact is not eligible for publication.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            browser-tests/playwright-report
            browser-tests/test-results
          if-no-files-found: warn
          retention-days: 7

name: Browser compatibility

on:
  push:
    branches:
      - 'agent/v3-browser-harness'
      - 'agent/v3-gallery-browser'
      - 'agent/v3-composition-browser'
      - 'agent/v3-vite-artifact-browser'
  pull_request:
    branches:
      - agent/modernization-baseline
      - agent/v3-browser-harness
      - agent/v3-gallery-browser
      - agent/v3-composition-browser

permissions:
  contents: read

jobs:
  v3-plugins:
    name: Summernote 0.9.1 / Heading + Gallery v3 (Vite artifacts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout compatibility harness
        uses: actions/checkout@v6

      - name: Checkout Heading v3 Vite proof
        uses: actions/checkout@v6
        with:
          repository: eissasoubhi/summernote-heading
          ref: agent/v3-vite-toolchain
          path: vendor/summernote-heading

      - name: Checkout Gallery v3 Vite proof
        uses: actions/checkout@v6
        with:
          repository: eissasoubhi/summernote-gallery
          ref: agent/v3-vite-toolchain
          path: vendor/summernote-gallery

      - name: Setup legacy Node for Bricks build
        uses: actions/setup-node@v7
        with:
          node-version: 16.20.2
          cache: npm

      - name: Build Bricks from tested source
        run: |
          npm ci
          npm run build

      - name: Setup Node for v3 plugins and browser harness
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build Heading v3 Vite artifact
        working-directory: vendor/summernote-heading/v3-tooling
        run: |
          npm install
          npm run check
          mkdir -p ../dist/v3
          cp dist/index.umd.cjs ../dist/v3/summernote-heading.js

      - name: Build Gallery v3 Vite artifact
        working-directory: vendor/summernote-gallery/v3-tooling
        run: |
          npm install
          npm run check
          mkdir -p ../dist/v3
          cp dist/index.umd.cjs ../dist/v3/summernote-gallery.js

      - name: Install browser harness
        working-directory: browser-tests
        run: npm install

      - name: Install Playwright browsers
        working-directory: browser-tests
        run: npx playwright install --with-deps

      - name: Run Summernote browser matrix
        working-directory: browser-tests
        run: npm test

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            browser-tests/playwright-report
            browser-tests/test-results
          if-no-files-found: warn
          retention-days: 7

name: CI

on:
  push:
    branches:
      - develop
      - master
      - 'agent/**'
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  sync-release-lock:
    name: Synchronize coordinated release lock
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/coordinated-rc11-rc2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Synchronize root package-lock identity
        run: npm version 3.0.0-rc.11 --no-git-tag-version --allow-same-version

      - name: Commit synchronized lock metadata when needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Release lock identity is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'release: synchronize Bricks lock identity'
          git push origin HEAD:${{ github.head_ref }}

  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate promoted root package
        run: npm run pack:check

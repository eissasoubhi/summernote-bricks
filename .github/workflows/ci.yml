name: CI

on:
  push:
    branches:
      - develop
      - 'agent/**'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Legacy baseline (Node 16)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 16.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate npm package
        run: npm pack --dry-run

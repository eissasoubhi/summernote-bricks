name: Sync rc.2 lockfile

on:
  push:
    branches:
      - agent/rc2-integrity-collision

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/rc2-integrity-collision
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Synchronize package identity
        run: npm version 3.0.0-rc.2 --no-git-tag-version --allow-same-version
      - name: Verify dependency graph is untouched
        run: |
          git diff -- package-lock.json
          test "$(node -p "require('./package-lock.json').version")" = "3.0.0-rc.2"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "3.0.0-rc.2"
      - name: Commit mechanical lockfile sync
        run: |
          rm .github/workflows/sync-rc2-lockfile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/workflows/sync-rc2-lockfile.yml
          git diff --cached --exit-code && exit 0
          git commit -m "Sync package lock version for rc.2"
          git push
